[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacam"
version = "1.0.0"
description = "Eczaneler için Raspberry Pi AI Camera (IMX500) tabanlı mağaza içi analitik"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6", "numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "opencv-python-headless>=4.9"]

[project.scripts]
pharmacam = "pharmacam.__main__:main"

[tool.setuptools.packages.find]
include = ["pharmacam*"]

[tool.setuptools.package-data]
pharmacam = ["api/static/*", "api/static/vendor/*", "hub/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
