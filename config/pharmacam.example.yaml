# PharmaCam — cihaz yapılandırması
# Kurulum betiği bu dosyayı config/pharmacam.yaml olarak kopyalar.
# Bölgeleri en kolay web panelindeki "Bölgeler" sekmesinden çizebilirsiniz;
# koordinatlar görüntüye göre 0..1 aralığındadır (sol üst = 0,0).

device:
  id: pharmacam-001            # her cihaz için benzersiz
  pharmacy_name: Örnek Eczanesi
  timezone: Europe/Istanbul

camera:
  source: imx500               # imx500 | simulator
  model: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
  width: 1280
  height: 960
  fps: 30                      # görüntü hızı; yapay zekâ modeli bunun yarısında (~15/sn) analiz eder
  score_threshold: 0.45
  hflip: false                 # kamera ters monte edildiyse hflip+vflip: true
  vflip: false
  watchdog_seconds: 15         # bu kadar saniye kare gelmezse servis yeniden başlar

tracker:
  high_threshold: 0.55
  low_threshold: 0.30
  match_iou: 0.25
  min_hits: 3
  max_lost_seconds: 2.0

staff:
  enabled: true
  white_ratio_threshold: 0.32  # gövdedeki beyaz piksel oranı (önlük eşiği)
  min_samples: 5
  saturation_max: 55
  value_min: 165
  staff_zone_ratio: 0.6        # zamanının %60'ı tezgâh arkasında geçen kişi = personel

analytics:
  occupancy_mode: hybrid       # visible | counter | hybrid
  min_zone_dwell_seconds: 3.0  # rafta "durdu" sayılması için en az süre
  min_queue_seconds: 3.0
  door_hysteresis: 0.02
  heatmap_grid: [64, 48]
  min_visit_seconds: 2.0
  empty_reset_seconds: 90

storage:
  path: data/pharmacam.db
  retention_days: 400

server:
  host: 0.0.0.0
  port: 8080
  username: admin
  password: "degistir-beni"    # panel şifresi — kurulumda değiştirin
  live_view: true
  blur_people: false           # true: canlı görüntüde kişileri bulanıklaştır (görüntü her durumda kaydedilmez)

reports:
  dir: data/reports
  opening_hour: 8
  closing_hour: 22

sync:
  enabled: false
  hub_url: https://hub.ornek.com
  device_token: ""
  interval_seconds: 60

zones:
  - id: kapi
    type: entrance
    name: Giriş Kapısı
    line: [[0.05, 0.92], [0.35, 0.92]]
    inside_point: [0.5, 0.5]
  - id: tezgah
    type: service
    name: Tezgâh
    polygon: [[0.35, 0.35], [0.70, 0.35], [0.70, 0.48], [0.35, 0.48]]
  - id: sira
    type: queue
    name: Sıra Alanı
    polygon: [[0.40, 0.48], [0.65, 0.48], [0.65, 0.85], [0.40, 0.85]]
  - id: personel
    type: staff
    name: Tezgâh Arkası
    polygon: [[0.30, 0.10], [0.75, 0.10], [0.75, 0.34], [0.30, 0.34]]
  - id: raf1
    type: shelf
    name: Dermokozmetik
    polygon: [[0.0, 0.30], [0.18, 0.30], [0.18, 0.80], [0.0, 0.80]]
