<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaCam Merkez</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--surface:#fff;--surface-2:#f5f5f7;--border:#e5e5ea;--ink:#1d1d1f;--muted:#6e6e73;--brand:#1d1d1f;--brand-soft:#ececf0;--s1:#3a3a3c;--s1-band:#d2d2d7;--good:#248a3d;--bad:#d03b3b;--grid:#ececf0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a0a0b;--surface:#161618;--surface-2:#1d1d20;--border:#2c2c30;--ink:#f5f5f7;--muted:#8e8e93;--brand:#161618;--brand-soft:#232327;--s1:#d1d1d6;--s1-band:#3a3a3e;--grid:#26262a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0a0b;--surface:#161618;--surface-2:#1d1d20;--border:#2c2c30;--ink:#f5f5f7;--muted:#8e8e93;--brand:#161618;--brand-soft:#232327;--s1:#d1d1d6;--s1-band:#3a3a3e;--grid:#26262a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-size:18px}main{max-width:1320px;margin:0 auto;padding:20px 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile,.card,.ph{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.tile .l{color:var(--muted);font-size:12.5px}.tile .v{font-size:30px;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:18px}
.ph{cursor:pointer;text-align:left;font:inherit;color:inherit}.ph.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.ph h3{margin:0 0 2px;font-size:15px}.ph .st{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--good)}
.ph .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ph .nums b{display:block;font-size:22px}.ph .nums span{font-size:11.5px;color:var(--muted)}
.card{margin-bottom:16px}.card h2{font-size:15px;margin:0 0 10px}.chart{position:relative;height:260px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%;border-radius:10px;background:#0d1312}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-weight:600}
.muted{color:var(--muted)}@media(max-width:800px){.two{grid-template-columns:1fr}main{padding:14px 16px}}
</style>
</head>
<body>
<header><span><b>✚ PharmaCam Merkez</b> <span style="opacity:.85">· eczane filosu</span></span><span id="clock"></span></header>
<main>
  <div class="tiles" id="ov"></div>
  <div class="grid" id="devs"></div>
  <section id="detail" hidden>
    <div class="card"><h2 id="d-title">Eczane</h2><div class="chart"><canvas id="c-daily"></canvas></div></div>
    <div class="two">
      <div class="card"><h2>Bugün saatlik giriş</h2><div class="chart"><canvas id="c-hourly"></canvas></div></div>
      <div class="card"><h2>Son 7 gün ısı haritası</h2><img id="d-heat" alt="Isı haritası"></div>
    </div>
    <div class="card"><h2>Raflar (son 7 gün)</h2><table id="d-zones"></table></div>
  </section>
</main>
<script src="static/vendor/chart.umd.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const api=p=>fetch(p.replace(/^\//,""),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const dur=s=>s==null?"—":s<60?`${Math.round(s)} sn`:`${Math.floor(s/60)} dk ${String(Math.round(s%60)).padStart(2,"0")} sn`;
const shift=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
let sel=null, charts={};
Chart.defaults.color=css("--muted");Chart.defaults.borderColor=css("--grid");Chart.defaults.maintainAspectRatio=false;
function chart(id,cfg){charts[id]?.destroy();cfg.options={plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0}}},...(cfg.options||{})};charts[id]=new Chart(document.getElementById(id),cfg)}
const bar=(d,c)=>({data:d,backgroundColor:c,borderRadius:{topLeft:4,topRight:4},borderSkipped:"bottom",maxBarThickness:30});
async function refresh(){
  const [ov,devs]=await Promise.all([api("/api/v1/overview"),api("/api/v1/devices")]);
  $("#ov").innerHTML=[["Eczane",ov.pharmacies],["Çevrimiçi",ov.online],["Şu an içeride",ov.inside_now],["Şu an sırada",ov.queue_now],["Bugün toplam müşteri",ov.entries_today]]
    .map(([l,v])=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  $("#devs").innerHTML=devs.map(d=>`<button class="ph${sel===d.id?" sel":""}" data-id="${esc(d.id)}"><h3>${esc(d.pharmacy_name)}</h3>
    <div class="st"><span class="dot${d.online?" on":""}"></span>${d.online?(d.camera_ok?"çevrimiçi · kamera aktif":"çevrimiçi · kamera sorunu"):"çevrimdışı"} · ${esc(d.id)}</div>
    <div class="nums"><div><b>${d.online?d.live.occupancy??0:"—"}</b><span>içeride</span></div><div><b>${d.online?d.live.queue_length??0:"—"}</b><span>sırada</span></div><div><b>${d.today.entries}</b><span>bugün giren</span></div></div>
    <div class="st" style="margin-top:8px">ort. bekleme ${dur(d.today.avg_wait_s)} · vazgeçen ${d.today.abandoned}${d.system.cpu_temp_c?` · ${d.system.cpu_temp_c}°C`:""}</div></button>`).join("")||`<p class="muted">Henüz bağlı cihaz yok. Cihazda sync.enabled: true ve hub_url ayarlayın.</p>`;
  document.querySelectorAll(".ph").forEach(b=>b.onclick=()=>{sel=b.dataset.id;refresh();detail(devs.find(x=>x.id===sel))});
  $("#clock").textContent=new Date().toLocaleTimeString("tr-TR");
}
async function detail(d){
  $("#detail").hidden=false;$("#d-title").textContent=`${d.pharmacy_name} — son 30 gün günlük müşteri`;
  const end=d.day,start=shift(end,-29),w0=shift(end,-6);
  const [daily,hourly,zones]=await Promise.all([api(`/api/v1/devices/${d.id}/daily?start=${start}&end=${end}`),api(`/api/v1/devices/${d.id}/hourly?day=${end}`),api(`/api/v1/devices/${d.id}/zones?start=${w0}&end=${end}`)]);
  chart("c-daily",{type:"bar",data:{labels:daily.map(r=>r.day.slice(8)+"."+r.day.slice(5,7)),datasets:[bar(daily.map(r=>r.entries),css("--s1"))]}});
  chart("c-hourly",{type:"bar",data:{labels:hourly.map(r=>String(r.hour).padStart(2,"0")),datasets:[bar(hourly.map(r=>r.entries),css("--s1"))]}});
  $("#d-heat").src=`api/v1/devices/${d.id}/heatmap.png?start=${w0}&end=${end}`;
  $("#d-zones").innerHTML="<tr><th>Raf</th><th>Duruş</th><th>Geçiş</th><th>Ort. süre</th></tr>"+zones.map(z=>`<tr><td>${esc(z.name)}</td><td>${z.stops}</td><td>${z.passes}</td><td>${dur(z.avg_dwell_s)}</td></tr>`).join("");
}
refresh();setInterval(refresh,10000);
</script>
</body>
</html>
